# Publishes to PyPI when a GitHub release is published. Uses PyPI trusted publishing,
# so no API token is stored. The version comes from the git tag, so the release tag must be
# v<version>, e.g. v0.1.0.
name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python ${{ matrix.python-version }} python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # Full history, so setuptools-scm can read the release tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Check the built version matches the release tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ ! -f "dist/struct_enum-${version}-py3-none-any.whl" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match the built version" >&2
            ls dist/ >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Matches the environment named in the PyPI trusted publisher settings.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
