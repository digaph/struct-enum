[project]
name = "struct-enum"
dynamic = ["version"]
description = "StructEnum: str enums whose members carry typed msgspec Struct properties"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Michel Rugenbrink" }]
keywords = ["enum", "msgspec", "struct", "typing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "msgspec>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/digaph/struct-enum"
"Issue Tracker" = "https://github.com/digaph/struct-enum/issues"
Source = "https://github.com/digaph/struct-enum"

[build-system]
requires = [
    "setuptools>=80",
    "setuptools-scm>=8",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["struct_enum"]

[tool.setuptools.package-dir]
"" = "src"

# The version comes from the git tag, so a release tag v0.1.0 builds version 0.1.0.
[tool.setuptools_scm]
version_file = "src/struct_enum/_version.py"

[tool.uv.config-settings]
editable_mode = "compat"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
